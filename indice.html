<!DOCTYPE html>

<title>ÍNDICE ECO‑VENADOS</title>
<style>
*{
box-sizing: border-box;
margin:0;
padding:0;
font-family: Arial, sans-serif;
}

body{
background-color: #ffffff;
padding: 40px 20px;
min-height: 100vh;
}

.titulo-pagina{
color: #ffffff;
font-size: 30px;
font-weight: bold;
text-align: center;
background-color: #556B2F;
width: 100%;
padding: 15px 25px;
border-radius: 14px;
margin-bottom: 40px;
}

.contenedor-layout{
max-width: 1100px;
margin:0 auto;
display: grid;
grid-template-columns: 180px 1fr 180px;
gap:20px;
align-items: start;
}

.columna-fotos{
display:flex;
flex-direction: column;
gap:15px;
}

.foto-lado{
width:100%;
height:160px;
border-radius:16px;
overflow:hidden;
border:2px solid #556B2F;
}

.foto-lado img{
width:100%;
height:100%;
object-fit:cover;
}

.columna-botones{
display:flex;
flex-direction:column;
gap:22px;
align-items:center;
}

.boton-indice{
width:100%;
max-width:700px;
padding:18px 25px;
border-radius:10px;
background-color:#556B2F;
color:#ffffff;
text-decoration:none;
font-weight:bold;
text-align:center;
font-size:18px;
}

.contenedor-botones{
display:flex;
justify-content:center;
flex-wrap:wrap;
margin-top:50px;
}

.boton-navegacion{
padding:12px 25px;
border-radius:10px;
background-color:#556B2F;
color:#ffffff;
text-decoration:none;
font-weight:bold;
text-align:center;
}

@media(max-width:850px){
.contenedor-layout{
grid-template-columns:1fr;
}
.foto-lado{
height:140px;
}
}
</style>
</head>
